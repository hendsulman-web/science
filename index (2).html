<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>مغامرة العلوم | الصف السادس</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f0ff;--card:#fff;--tx:#2d2250;--pu:#7b4fd6;--pk:#f06bb0;--tq:#19b5a5;--ok:#1f9d6b;--bad:#d9534f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1d1633;--card:#2a2147;--tx:#f1eaff}}
:root[data-theme="dark"]{--bg:#1d1633;--card:#2a2147;--tx:#f1eaff}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:19px/1.8 Tajawal,Tahoma,sans-serif}
.w{max-width:760px;margin:auto;padding:14px}.c{background:var(--card);border-radius:22px;padding:18px;margin:12px 0;box-shadow:0 3px 12px #0002}
h1{margin:0;font-size:1.5em;color:var(--pu)}h2{margin:.2em 0;color:var(--pk)}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;margin:5px;background:var(--pu);color:#fff;cursor:pointer;min-height:48px}
button.t{background:var(--tq)}button.k{background:var(--pk)}button.x{background:#8884}
button:disabled{opacity:.45;cursor:default}
.o{display:block;width:100%;text-align:right;background:var(--bg);color:var(--tx);border:2px solid var(--pu);margin:8px 0}
.pb{height:14px;background:#0002;border-radius:9px;overflow:hidden;margin:8px 0}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--pk),var(--tq))}
input{font:inherit;padding:12px;border-radius:12px;border:2px solid var(--tq);width:calc(100% - 28px);background:var(--bg);color:var(--tx)}
.g{color:var(--ok)}.b{color:var(--bad)}.s{opacity:.7;font-size:.8em}.hd{display:flex;gap:10px;align-items:center}.hd span{font-size:2.2em}
table{width:100%;border-collapse:collapse;font-size:.85em}td,th{border-bottom:1px solid #8884;padding:6px;text-align:right}
.cert{border:6px double var(--pu);text-align:center;border-radius:18px;padding:18px;background:var(--card)}
@media print{body *{visibility:hidden}.cert,.cert *{visibility:visible}.cert{position:absolute;inset:0;color:#000;background:#fff}}
</style></head><body><div class="w"><div class="hd"><span>🧑‍🔬</span><div><h1>🔬 مغامرة العلوم</h1><div class="s">رحلتي نحو الإتقان — الصف السادس</div></div></div><div id="app"></div></div>
<script>
const PB={1:[['الخلية','الوحدة الأساسية للمخلوق الحي'],['براون','اكتشف نواة الخلية'],['العضو','مجموعة من نسيجين مختلفين أو أكثر تعمل معًا للقيام بوظيفة محددة'],['العنصر','مادة نقية لا يمكن تجزئتها إلى مواد أبسط منها'],['الجهاز الحيوي','مجموعة الأعضاء التي تعمل معًا لأداء وظيفة معينة']],
2:[['النقل السلبي','حركة المواد عبر الأغشية من دون أن تستخدم طاقة الخلية'],['الخاصية الأسموزية','انتقال جزيئات الماء عبر الغشاء البلازمي'],['النقل النشط','انتقال المواد عبر الأغشية مع وجود طاقة'],['البلعمة','ابتلاع المواد الكبيرة عن طريق إحاطتها بغشاء بلازمي']],
3:[['دورة الخلية','العملية المستمرة من النمو والانقسام والتعويض'],['الانقسام المتساوي','انقسام الخلية إلى خليتين متماثلتين'],['مدة الحياة','أطول فترة زمنية يعيشها المخلوق الحي في أفضل الظروف'],['الخلية المخصبة','تنتج عن اتحاد مشيج مذكر مع مشيج مؤنث'],['الكروموسومات','أشرطة صغيرة داخل نواة الخلية تحمل صفات المخلوق الحي']],
4:[['الوراثة','انتقال الصفات الوراثية من الآباء إلى الأبناء'],['الصفة الموروثة','صفة تنتقل من الآباء إلى الأبناء'],['مندل','اكتشف المبادئ الأساسية لعلم الوراثة'],['الجين','يحتوي على المعلومات الكيميائية للصفة الموروثة'],['الصفة المتنحية','صفة تحجبها صفة سائدة'],['مخطط السلالة','مخطط يستعمل لتتبع الصفات في العائلة'],['الحامل للصفة','الشخص الذي ورث جينًا لصفة ولكن لا تظهر عليه']],
5:[['السيقان','تراكيب تبقي النبات محافظًا على قوامه'],['الجذور','جزء من النبات يثبت النبات في التربة'],['الحزازيات','نباتات لا تحتوي على جذور حقيقية'],['البناء الضوئي','عملية تقوم بها النباتات تستخدم فيها ضوء الشمس لإنتاج الغذاء'],['التكاثر','إنتاج أفراد من النوع نفسه'],['البذرة','تركيب يخزن الغذاء وفيه نبات صغير'],['التلقيح','انتقال حبوب اللقاح من المتك إلى الميسم'],['تعاقب الأجيال','العملية المستمرة للانتقال من مرحلة التكاثر الجنسي إلى مرحلة التكاثر اللاجنسي']]};
const F=(l,i)=>{const t=PB[l].map(x=>x[0]),n=t.length,o=[t[(i+1)%n],t[(i+2)%n],t[(i+3)%n]];o.splice(i%4,0,t[i]);return['m',PB[l][i][1]+':',o,i%4]};
const R=(l,i)=>{const d=PB[l].map(x=>x[1]),n=d.length,o=[d[(i+1)%n],d[(i+2)%n],d[(i+3)%n]];o.splice((i+1)%4,0,d[i]);return['m','معنى «'+PB[l][i][0]+'»:',o,(i+1)%4]};
const M=(t,o,c)=>['m',t,o,c],TF=(t,c)=>['m','صح أم خطأ: '+t,['صح','خطأ'],c];
const ST='قال أربعة طلاب: خالد: تفتقد الخلية الحيوانية للغشاء الخلوي. فهد: البلاستيدات الخضراء توجد في الخلية الحيوانية فقط. عمر: يحيط بالخلية النباتية جدار خلوي لحمايتها. محمد: يقتصر وجود الرايبوسومات على الخلية النباتية. من إجابته صحيحة؟';
const SD=[
{id:'L1S1',l:1,n:'الخلية ومستويات التنظيم',p:'3',e:'الخلية هي الوحدة الأساسية للمخلوق الحي. النسيج مجموعة خلايا متشابهة تقوم معًا بالوظيفة نفسها، والنسيج العصبي ينقل الرسائل. والعضو مجموعة من نسيجين مختلفين أو أكثر تعمل معًا (مثل القلب)، والجهاز الحيوي مجموعة أعضاء تعمل معًا. الترتيب: خلية، نسيج، عضو، جهاز حيوي، مخلوق حي.',h:'ابدئي بالخلية ثم اصعدي: نسيج، عضو، جهاز حيوي.',it:[F(1,0),M('مجموعة من الخلايا المتشابهة تقوم معًا بالوظيفة نفسها:',['العضو','الجهاز الحيوي','النسيج','الخلية'],2),M('نسيج ينقل الرسائل في الجسم:',['العضلي','العصبي','الضام','الطلائي'],1),F(1,2),M('ما القلب؟',['نسيج','جهاز','عضو','مخلوق حي'],2),F(1,4),M('رتّبي مستويات التنظيم في المخلوقات الحية من الأصغر إلى الأكبر:',['خلية – نسيج – عضو – جهاز حيوي – مخلوق حي','نسيج – خلية – عضو – مخلوق حي – جهاز حيوي','مخلوق حي – جهاز حيوي – عضو – نسيج – خلية','خلية – عضو – نسيج – جهاز حيوي – مخلوق حي'],0),R(1,0),R(1,4)]},
{id:'L1S2',l:1,n:'العلماء ونظرية الخلية',p:'3–4، 8',e:'روبرت هوك أول من شاهد الخلية ووصفها بأنها صناديق (في شريحة من الفلين). وروبرت براون اكتشف نواة الخلية. وأول ما شاهده ليفنهوك تحت المجهر المخلوقات وحيدة الخلية. وتتضمن نظرية الخلية: جميع المخلوقات الحية تتكون من خلية أو أكثر، والخلية وحدة البناء الأساسية، وتنتج الخلايا عن خلايا موجودة.',h:'اربطي اسم العالم بما اكتشفه.',it:[F(1,1),M('أول من شاهد الخلية ووصفها بأنها صناديق:',['روبرت هوك','ليفنهوك','روبرت براون','شلايدن'],0),M('أول ما شاهده ليفنهوك تحت المجهر:',['الخلية','المخلوقات وحيدة الخلية','نواة الخلية','مخلوقات عديدة الخلايا'],1),M('فحص العالم روبرت هوك شريحة رقيقة جدًا من الفلين تحت مجهر بدائي فشاهد فراغات مفتوحة ومنتظمة، وأطلق عليها اسم:',['النسيج','النواة','الخلية','الذرة'],2),M('أي الفقرات التالية ليست جزءًا من نظرية الخلية؟',['جميع المخلوقات الحية تتكون من خلية أو أكثر','الخلية وحدة البناء الأساسية للمخلوقات الحية','الخلية تتكون من العديد من العناصر والمركبات','تنتج الخلايا عن خلايا موجودة'],2),R(1,1)]},
{id:'L1S3',l:1,n:'العنصر والمركب',p:'3',e:'العنصر مادة نقية لا يمكن تجزئتها إلى مواد أبسط منها. والمركب مادة تتكون باتحاد كيميائي بين عنصرين أو أكثر، مثل الماء المتكون من الهيدروجين والأكسجين.',h:'العنصر لا يتجزأ إلى مواد أبسط، والمركب يتكون من اتحاد عنصرين أو أكثر.',it:[F(1,3),M('مادة تتكون باتحاد كيميائي بين عنصرين أو أكثر:',['العنصر','الجزيء','المركب','الذرة'],2),M('يتكون الماء من الهيدروجين والأكسجين. كيف أصنف الماء؟',['مركب','عنصر','ذرة','خلية'],0),R(1,3),M('المركب هو:',['مادة نقية لا يمكن تجزئتها إلى مواد أبسط منها','مادة تتكون باتحاد كيميائي بين عنصرين أو أكثر','مجموعة من نسيجين مختلفين أو أكثر','مجموعة الأعضاء التي تعمل معًا'],1)]},
{id:'L2S1',l:2,n:'أجزاء الخلية ووظائفها',p:'5–7',e:'النواة مركز تحكم الخلية وتحتوي على معظم المعلومات الوراثية. الميتوكندريا أجسام على شكل عصي تقوم بالتنفس الهوائي وهي مصدر طاقة الخلية. الفجوات تراكيب تشبه الكيس تخزن الماء والغذاء والفضلات.',h:'لكل جزء عمل: التحكم، الطاقة، التخزين.',it:[M('تراكيب تشبه الكيس تخزن الماء والغذاء في الخلية:',['الميتوكندريا','الفجوات','النواة','السيتوبلازم'],1),M('مركز تحكم الخلية:',['الميتوكندريا','الغشاء البلازمي','النواة','السيتوبلازم'],2),M('مصدر طاقة الخلية:',['الميتوكندريا','البلاستيدات','النواة','الغشاء البلازمي'],0),TF('الميتوكندريا أجسام على شكل عصي تقوم بعملية التنفس الهوائي.',0),TF('تحتوي النواة على معظم المعلومات الوراثية للخلية.',0),M('أي مما يلي تركيب خلوي يقوم بتخزين الغذاء؟',['النواة','الفجوة','البلاستيدات','الغشاء البلازمي'],1),M('تخزن الفضلات والغذاء داخل الخلية في:',['الفجوة العصارية','النواة','السيتوبلازم','غشاء الخلية'],0)]},
{id:'L2S2',l:2,n:'الخلية النباتية والحيوانية',p:'5–8',e:'للخلية النباتية فجوة كبيرة، ويحيط بها جدار خلوي لحمايتها، وتصنع الغذاء في البلاستيدات الخضراء التي توجد في الخلية النباتية فقط. أما الخلية الحيوانية فلا جدار خلوي لها، وتحتوي كخلايا جسمك على السيتوبلازم.',h:'الجدار الخلوي والبلاستيدات الخضراء والفجوة الكبيرة من خصائص الخلية النباتية.',it:[M('أي العبارات التالية صحيحة للتمييز بين الخلية الحيوانية والخلية النباتية؟',['للخلية النباتية فجوة كبيرة','للخلية الحيوانية جدار خلوي','ليس للخلية الحيوانية نواة','للخلية الحيوانية بلاستيدات خضراء'],0),TF('تحتوي الخلايا الحيوانية على جدار خلوي.',1),M('أي التراكيب التالية يتم فيها تصنيع الغذاء في الخلية النباتية؟',['الشبكة الأندوبلازمية','الميتوكندريا','الرايبوسومات','البلاستيدات الخضراء'],3),M('أي مما يلي يوجد في خلايا جسمك؟',['جدار خلوي','كلوروفيل','سيتوبلازم','بلاستيدات خضراء'],2),M(ST,['خالد','فهد','عمر','محمد'],2)]},
{id:'L2S3',l:2,n:'حركة المواد عبر الغشاء',p:'5',e:'النقل السلبي حركة المواد عبر الأغشية دون استخدام طاقة الخلية، والخاصية الأسموزية انتقال جزيئات الماء عبر الغشاء البلازمي، والنقل النشط انتقال المواد عبر الأغشية مع وجود طاقة، والبلعمة ابتلاع المواد الكبيرة بإحاطتها بغشاء بلازمي. وعندما يتساوى تركيز المادة على جانبي الغشاء تكون في حالة اتزان.',h:'اسألي: هل تحتاج الخلية طاقة؟ وهل المادة ماء أو كبيرة الحجم؟',it:[F(2,0),F(2,1),F(2,2),F(2,3),M('عندما يكون تركيز المادة متساويًا على جانبي الغشاء البلازمي فإن المادة تكون في حالة:',['اتزان','انتشار','تخمر','انتقال'],0),M('هناك مواد كبيرة جدًا لا تستطيع أن تمر خلال الغشاء البلازمي للخلية، فكيف حلت الخلية ذلك؟ عن طريق:',['النقل السلبي','النقل النشط','الخاصية الأسموزية','البلعمة'],3),R(2,0),R(2,3)]},
{id:'L3S1',l:3,n:'دورة الخلية والكروموسومات',p:'10',e:'دورة الخلية هي العملية المستمرة من النمو والانقسام والتعويض. مدة الحياة أطول فترة يعيشها المخلوق الحي في أفضل الظروف. الكروموسومات أشرطة صغيرة داخل نواة الخلية تحمل صفات المخلوق الحي، وفي معظم خلايا جسم الإنسان 46 كروموسومًا، وفي الخلية الجنسية 23 كروموسومًا.',h:'الخلية الجنسية فيها 23 كروموسومًا، وخلايا الجسم فيها 46.',it:[F(3,0),M('تحتوي معظم خلايا جسم الإنسان على ... كروموسوم:',['23','46','48'],1),F(3,2),F(3,4),M('عدد الكروموسومات الموجودة في الخلية الجنسية عند الإنسان:',['23','12','46'],0),R(3,2),R(3,4)]},
{id:'L3S2',l:3,n:'الانقسام المتساوي والمنصف والإخصاب',p:'10',e:'الانقسام المتساوي ينتج خليتين متماثلتين (متطابقتين). والانقسام المنصف تنقسم فيه النواة مرتين. والخلية المخصبة تنتج عن اندماج الخلايا الجنسية: اتحاد مشيج مذكر مع مشيج مؤنث.',h:'المتساوي: خليتان متطابقتان، والمنصف: النواة تنقسم مرتين.',it:[F(3,1),F(3,3),M('أي العمليات التالية تؤدي إلى انقسام الخلية إلى خليتين متطابقتين؟',['الانقسام المنصف','الإخصاب','الانقسام المتساوي'],2),M('نوع من الانقسام الخلوي تنقسم النواة فيه مرتين:',['الانقسام المتساوي','الانقسام المنصف','المتطابق'],1),M('الخلية المخصبة تنتج بسبب:',['انقسام الخلايا الجنسية','اندماج الخلايا الجنسية','انقسام الخلايا الجسمية'],1),R(3,1),R(3,3)]},
{id:'L4S1',l:4,n:'الوراثة والجين ومندل',p:'12–13',e:'الوراثة انتقال الصفات الوراثية من الآباء إلى الأبناء. مندل اكتشف المبادئ الأساسية لعلم الوراثة، والجين يحتوي على المعلومات الكيميائية للصفة الموروثة وهو العامل الذي وصفه مندل. والمشيج يحمل نصف عدد كروموسومات خلايا الجسم.',h:'الوراثة تنقلها الجينات، واكتشف مبادئها مندل.',it:[F(4,0),M('العوامل التي وصفها جريجور مندل وتتحكم في صفات المخلوقات الحية هي:',['الجينات','مخطط السلالة','الغشاء الخلوي','الغريزة'],0),F(4,3),F(4,2),M('إذا كان عدد الكروموسومات في خلايا الحصان 32 كروموسومًا، فما عدد الكروموسومات في المشيج المذكر؟',['8','64','16','32'],2),R(4,0),R(4,3),R(4,2)]},
{id:'L4S2',l:4,n:'الصفات السائدة والمتنحية ومخطط السلالة',p:'12',e:'الصفة الموروثة تنتقل من الآباء إلى الأبناء. الصفة السائدة تمنع صفة أخرى من الظهور، والصفة المتنحية تحجبها صفة سائدة. مخطط السلالة يستعمل لتتبع الصفات في العائلة، والحامل للصفة هو الشخص الذي ورث جينًا لصفة ولكن لا تظهر عليه.',h:'السائدة تظهر وتحجب، والمتنحية تُحجب.',it:[F(4,1),F(4,4),M('الصفة التي تمنع صفة أخرى من الظهور تسمى:',['الصفة السائدة','الصفة المتنحية','الغريزة','الصفة المكتسبة'],0),M('تعد صفة الطيران لدى العصافير من الصفات:',['المكتسبة','السائدة','الموروثة','المتنحية'],2),F(4,5),M('لتتبع الصفات الوراثية في العائلة ودراسة الأنماط الوراثية نستخدم:',['الانتخاب الطبيعي','مخطط السلالة','دورة الخلية','التلقيح الخلطي'],1),F(4,6),R(4,4)]},

function LB(){return LN.map((n,i)=>`<button class="${lOk(i+1)?'t':'k'}" onclick="startD(${i+1})">${lOk(i+1)?'✅':IC[i]} الدرس ${i+1}: ${n}</button>`).join('')+(allOk()?'<button onclick="showCert()">🏅 شهادتي</button>':'')+(Object.keys(S.R).length?'<button class="t" onclick="csv()">⬇️ تحميل تقرير الطالبة</button>':'')+`<button class="k" onclick="S.st='games';draw()">🎮 ساحة الألعاب</button><hr><button class="x" onclick="S.set.snd=!S.set.snd;draw()">${S.set.snd?'🔊 الصوت: تشغيل':'🔇 الصوت: إيقاف'}</button><button class="x" onclick="S.set.tm=({30:45,45:20,20:0,0:30})[S.set.tm];draw()">⏱️ المؤقت: ${S.set.tm?S.set.tm+' ث':'إيقاف'}</button>`}

const A=document.getElementById('app'),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const qs=(s,p)=>Q.filter(q=>q[1]==s&&q[2]==p),sk=id=>SK.find(s=>s.id==id);
const card=h=>`<div class="c">${h}</div>`,pb=(n,t)=>`<div class="pb"><i style="width:${Math.round(100*n/t)}%"></i></div><div class="s">${n} من ${t}</div>`;
const pct=(c,t)=>t?Math.round(100*c/t):0;
function dsc(id,r=S){const l=qs(id,'d');return[l.filter(q=>r.da[q[0]]==q[5]).length,l.length]}
function asc(id,r=S){const l=qs(id,'a');return[l.filter(q=>r.pa[q[0]]==q[5]).length,l.length]}
let TI;function draw(){clearInterval(TI);save();A.innerHTML=view();window.scrollTo(0,0);const live=S.st=='diag'||S.st=='post'||(S.st=='rem'&&S.step>0&&!S.g&&S.fb!='ok'&&S.fb!='help');if(live&&S.set.tm)tmr()}
function tmr(){let t=S.set.tm;const el=document.getElementById('tm');TI=setInterval(()=>{t--;if(el)el.textContent='⏱️ '+t+' ث';if(t<=5&&t>0)snd('tick');if(t<=0){clearInterval(TI);S.st=='rem'?ap(-1):S.st=='diag'?ad(-1):aa(-1)}},1000)}
function opts(q,f,dis){return(!dis&&S.set.tm?`<div id="tm" class="s">⏱️ ${S.set.tm} ث</div>`:'')+q[4].map((o,i)=>`<button class="o" ${dis?'disabled':''} onclick="${f}(${i})">${esc(o)}</button>`).join('')}
function view(){
if(S.st=='home')return card(`<h2>مرحبًا بكِ!</h2><p>اكتبي اسمكِ لنبدأ:</p><input id="n" value="${esc(S.name||'')}" placeholder="اسم الطالبة"><br><button onclick="go()">ابدئي ✨</button>${S.da?'<button class="t" onclick="S.st=S.lst||\'lessons\';draw()">متابعة رحلتي</button>':''}<p class="s">يُحفظ تقدّمكِ في هذا المتصفح وعلى هذا الجهاز فقط.</p>`);
if(S.st=='lessons')return card(`<h2>مرحبًا يا عالمة المستقبل! 🌟</h2><p>سنكتشف معًا ما تعرفينه في العلوم، ثم نتدرب على المهارات التي تحتاج إلى تقوية حتى تصبحي بطلة العلوم!</p>`)+card(`<h2>اختاري درسًا</h2>${LB()}`)+tools();
if(S.st=='diag'){const q=Q.find(x=>x[0]==S.dq[S.qi]);return card(`<div class="s">المرحلة 1: أكتشف مستواي</div>${pb(S.qi,S.dq.length)}<h2>${esc(q[3])}</h2>${opts(q,'ad')}`)}
if(S.st=='ana'){const rows=SK.filter(s=>s.l==S.l).map(s=>{const[c,t]=dsc(s.id);return`<tr><td>${s.n}</td><td>${pct(c,t)}%</td><td>${pct(c,t)<80?'🌱 تحتاج تقوية':'✅ متقنة'}</td></tr>`}).join('');
return card(`<div class="s">المرحلة 2: أحدد مهاراتي</div><table><tr><th>المهارة</th><th>الأداء</th><th>الحالة</th></tr>${rows}</table>`)+card(S.weak.length?`<p>سنتدرب على ${S.weak.length} مهارة فقط، وهي التي تحتاج تقوية.</p><button onclick="S.st='rem';S.ri=0;S.step=0;draw()">ابدئي العلاج 💪</button>`:`<h2 class="g">تهانينا يا بطلة العلوم! 🌟</h2><p>أتقنتِ جميع مهارات الدرس.</p><button class="t" onclick="S.st='res';draw()">عرض النتيجة</button>`)}
if(S.st=='rem'){const s=sk(S.weak[S.ri]);if(S.step==0)return card(`<div class="s">المرحلة 3: أتدرب وأتحسن (${S.ri+1}/${S.weak.length})</div><h2>أفهم المهارة: ${s.n}</h2><p>${s.e}</p><p class="s">📖 ص ${s.p}</p><button onclick="S.step=1;S.tr=0;S.fb=null;draw()">ابدئي التدريب</button>`);
if(S.step>qs(s.id,'p').length)return gview(gameFor(s.id),s.id,1);const ps=qs(s.id,'p'),q=ps[S.step-1],f=S.fb;
let m='';if(f=='ok')m=`<p class="g">${PR[S.step%3]}<br>الإجابة الصحيحة: ${esc(q[4][q[5]])}</p>`;if(f=='hint')m=`<p class="b">محاولة جيدة! فكري في هذا التلميح... ${s.h}</p>`;if(f=='help')m=`<p>لا بأس، سنفهمها معًا: ${s.e}</p><p>الإجابة: ${esc(q[4][q[5]])}</p>`;
return card(`<div class="s">${s.n}</div>${pb(S.step-1,ps.length)}<h2>${esc(q[3])}</h2>${opts(q,'ap',f=='ok'||f=='help')}${m}${f=='ok'||f=='help'?'<button class="t" onclick="nx()">التالي ➜</button>':''}`)}
if(S.st=='post'){const q=Q.find(x=>x[0]==S.aq[S.qi]);return card(`<div class="s">المرحلة 4: أثبت إتقاني</div>${pb(S.qi,S.aq.length)}<h2>${esc(q[3])}</h2>${opts(q,'aa')}`)}
if(S.st=='games')return card('<h2>🎮 ساحة الألعاب</h2><p class="s">لعب حر للتدريب؛ لا يغيّر نتائج الإتقان.</p>'+GM.map(g=>`<button class="k" onclick="startG('${g.id}')">${g.ic} ${g.n}</button>`).join('')+`<button onclick="S.st='lessons';draw()">رجوع</button>`);
if(S.st=='play')return gview(GM.find(g=>g.id==S.g.id),null,0);
if(S.st=='cert')return`<div class="cert"><h2>🏅 شهادة إنجاز</h2><p>تُمنح الطالبة</p><h1>${esc(S.name)}</h1><p>لإتمامها بنجاح جميع دروس «مغامرة العلوم» للصف السادس: ${LN.join('، ')}</p><p class="g">تهانينا يا بطلة العلوم! 🌟</p><p class="s">${S.cert}</p></div><button class="k" onclick="window.print()">🖨️ طباعة</button><button onclick="S.st='lessons';draw()">رجوع</button>`;
if(S.st=='res')return res();return''}
function tools(){return`<button class="x" onclick="if(confirm('سيتم حذف تقدّمكِ من هذا الجهاز. هل أنتِ متأكدة؟')){S={st:'home',name:'',set:S.set,R:{}};draw()}">بدء رحلة جديدة</button><button class="x" onclick="if(confirm('إنهاء الجلسة ومسح البيانات من هذا الجهاز؟')){try{localStorage.removeItem(K)}catch(e){}S={st:'home',name:'',set:S.set,R:{}};A.innerHTML=view()}">إنهاء الجلسة ومسح البيانات</button>`}
function go(){const v=document.getElementById('n').value.trim();if(!v){alert('اكتبي اسمكِ أولًا');return}S={st:'lessons',name:v,set:S.set,R:{}};snd('start');draw()}
function startD(l){snd('start');S.l=l;S.dq=Q.filter(q=>q[2]=='d'&&q[1][1]==l).map(q=>q[0]);S.qi=0;S.da={};S.pa={};S.pr={};S.st='diag';S.lst='lessons';draw()}
function ad(i){snd('pop');S.da[S.dq[S.qi]]=i;S.qi++;if(S.qi>=S.dq.length){S.weak=SK.filter(s=>s.l==S.l).filter(s=>{const[c,t]=dsc(s.id);return t>=2&&pct(c,t)<80}).map(s=>s.id);S.st='ana'}draw()}
function ap(i){const s=sk(S.weak[S.ri]),q=qs(s.id,'p')[S.step-1];if(i==q[5]){S.pr[q[0]]=S.tr?2:1;S.fb='ok';snd('ok')}else{snd('no');S.tr++;if(S.tr<2)S.fb='hint';else{S.pr[q[0]]=0;S.fb='help'}}draw()}
function nx(){const s=sk(S.weak[S.ri]),n=qs(s.id,'p').length,g=gameFor(s.id);S.g=null;S.step++;S.tr=0;S.fb=null;if(S.step==n+1&&g){S.g=gInit(g.id,s.id);snd('start');draw();return}if(S.step>n+(g?1:0)){S.ri++;S.step=0;if(S.ri>=S.weak.length){S.aq=S.weak.flatMap(id=>qs(id,'a').map(q=>q[0]));S.qi=0;S.pa={};S.st='post'}}draw()}
function aa(i){snd('pop');S.pa[S.aq[S.qi]]=i;S.qi++;if(S.qi>=S.aq.length){S.st='res';snd('win')}draw()}
function stat(s,r=S){if(!r.weak.includes(s.id))return'متقنة قبل العلاج';const[c,t]=asc(s.id,r);return pct(c,t)>=80?'متقنة بعد العلاج':'تحتاج إلى تدريب'}
function res(){let dc=0,dt=0,wc=0,wt=0,pc=0,pt=0,rows='';const LS=SK.filter(s=>s.l==S.l);S.R[S.l]={da:S.da,pa:S.pa,pr:S.pr,weak:S.weak};
LS.forEach(s=>{const[c,t]=dsc(s.id);dc+=c;dt+=t;let po='—';if(S.weak.includes(s.id)){const[a,b]=asc(s.id);wc+=c;wt+=t;pc+=a;pt+=b;po=pct(a,b)+'%'}rows+=`<tr><td>${s.n}</td><td>${pct(c,t)}%</td><td>${po}</td><td>${stat(s)}</td></tr>`});
const still=LS.filter(s=>stat(s)=='تحتاج إلى تدريب'),done=Object.keys(S.pr).length+S.weak.filter(id=>S.gm&&S.gm[id]).length,tot=S.weak.reduce((n,id)=>n+qs(id,'p').length+(gameFor(id)?1:0),0),imp=pt?pct(pc,pt)-pct(wc,wt):0;
let h=card(`<h2>بطاقة النتائج</h2><p>${esc(S.name)} — الدرس ${S.l}: ${LN[S.l-1]}</p><table><tr><th>المهارة</th><th>قبلي</th><th>بعدي</th><th>الحالة</th></tr>${rows}</table><p>المهارات المقيّمة: ${LS.length} | متقنة قبل العلاج: ${LS.length-S.weak.length} | احتاجت علاجًا: ${S.weak.length} | أتقنتها بعد العلاج: ${S.weak.length-still.length}</p><p>الأداء القبلي الكلي: ${pct(dc,dt)}%${pt?` | أداء المهارات المعالَجة: قبلي ${pct(wc,wt)}% ← بعدي ${pct(pc,pt)}% (التحسن ${imp>=0?'+':''}${imp} نقطة مئوية)`:''}</p><p class="s">إكمال الأنشطة: ${tot?pct(done,tot):100}% — وهذا غير إتقان المهارات.</p>${pb(tot?done:1,tot||1)}${still.length?`<p class="b">ما زالت تحتاج تدريبًا: ${still.map(s=>s.n).join('، ')}</p><button onclick="S.weak=${JSON.stringify(still.map(s=>s.id))};S.pr={};S.st='rem';S.ri=0;S.step=0;draw()">تدريب إضافي</button>`:''}<button class="t" onclick="csv()">⬇️ تحميل تقرير الطالبة</button><button class="t" onclick="shr('wa')">📲 إرسال بواتساب</button><button class="t" onclick="shr('mail')">✉️ إرسال بالبريد</button><button class="x" onclick="shr('copy')">📋 نسخ التقرير</button><button class="k" onclick="window.print()">🖨️ طباعة</button><button onclick="S.st='lessons';draw()">العودة للدروس</button>${allOk()?'<button class="k" onclick="showCert()">🏅 شهادتي</button>':''}`);
if(0)h+=`<div class="cert"><h2>🏅 شهادة إنجاز</h2><p>تُمنح الطالبة</p><h1>${esc(S.name)}</h1><p>شهادة إتمام الرحلة العلاجية في الدرس الأول (الخلايا) بنجاح</p><p class="g">تهانينا يا بطلة العلوم! 🌟</p><p class="s">${new Date().toLocaleDateString('ar-SA')}</p></div>`;
return h+tools()}
function csv(){const H=['اسم الطالبة','التاريخ','الدرس','معرف المهارة','اسم المهارة','عدد أسئلة التشخيص','الإجابات الصحيحة','نتيجة التشخيص %','عدد الأنشطة العلاجية','نتيجة التقويم البعدي %','حالة الإتقان','مقدار التحسن (نقطة)'];
const d=new Date().toISOString().slice(0,10),R=SK.filter(s=>S.R[s.l]).map(s=>{const r=S.R[s.l],[c,t]=dsc(s.id,r),w=r.weak.includes(s.id),[a,b]=asc(s.id,r),n=qs(s.id,'p').filter(q=>q[0] in r.pr).length+(S.gm&&S.gm[s.id]?1:0);return[S.name,d,LN[s.l-1],s.id,s.n,t,c,pct(c,t),n,w?pct(a,b):'',stat(s,r),w?pct(a,b)-pct(c,t):0]});
const t=[H,...R].map(r=>r.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),u=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=u;a.download='تقرير-'+S.name+'.csv';a.click()}
draw();
</script></body></html>
